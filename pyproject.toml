[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer2"
version = "0.1.0"
description = "An independent, evidence-based AI technical reviewer for video explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reviewer2 contributors" }]
keywords = ["rag", "llm", "whisper", "fact-checking", "technical-review", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.0"]
embeddings = ["sentence-transformers>=2.6.0"]
faiss = ["faiss-cpu>=1.8.0"]
documents = ["pymupdf>=1.24.0", "pypdf>=4.0.0", "python-docx>=1.1.0", "beautifulsoup4>=4.12.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
all = [
    "faster-whisper>=1.0.0",
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.8.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
reviewer2 = "app.main:main"
reviewer2-web = "app.serve:main"
reviewer2-eval = "app.evaluate:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["reviewer2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
